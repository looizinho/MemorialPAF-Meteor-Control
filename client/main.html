<body>
  {{> content}}
</body>

<template name="content">
  <div class="content">
    {{> header}}
    {{> blocks}}
    {{> idiomas}}
    {{> progresso}}
  </div>
</template>

<template name="progresso">
  <div class="progresso" aria-hidden="true">
    <svg>
      <rect class="progresso-trilho" width="100%" height="100%" rx="24" pathLength="100"></rect>
      <rect class="progresso-barra" width="100%" height="100%" rx="24" pathLength="100"></rect>
    </svg>
  </div>
</template>

<template name="header">
  <div class="header">
    <img class="logo" src="/icons/logo-vector-red.svg" alt="">
    <h1><span class="memorial">Memorial</span> <span class="paf-metal">PAF</span></h1>
  </div>
</template>

<template name="blocks">
  <div class="blocks">
    <button class="block-button {{ligado 'pedro'}}" id="pedro" aria-pressed="{{pressionado 'pedro'}}" {{bloqueio 'pedro'}}><span class="rotulo">O Pedro</span></button>
    <button class="block-button {{ligado 'linha'}}" id="linha" aria-pressed="{{pressionado 'linha'}}" {{bloqueio 'linha'}}><span class="rotulo">Linha do Tempo</span></button>
    <button class="block-button {{ligado 'multi'}}" id="multi" aria-pressed="{{pressionado 'multi'}}" {{bloqueio 'multi'}}><span class="rotulo">Multiplique-se</span></button>
  </div>
</template>

<template name="idiomas">
  <div class="idiomas">
    <button class="idioma-button {{selecionado 'Pt'}}" id="Pt">
      <img class="bandeira bandeira-branca" src="/icons/portugues-white.png" alt="">
      <img class="bandeira bandeira-preta" src="/icons/portugues-black.png" alt="">
      Português
    </button>
    <button class="idioma-button {{selecionado 'En'}}" id="En">
      <img class="bandeira bandeira-branca" src="/icons/ingles-white.png" alt="">
      <img class="bandeira bandeira-preta" src="/icons/ingles-black.png" alt="">
      Inglês
    </button>
  </div>
</template>
